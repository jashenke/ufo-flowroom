<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UFO Flowroom Kiosk</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0f172a}
  iframe{
    width:100%;height:100%;border:0;display:block;
    transform-origin:center center;
  }
  #err{
    position:fixed;top:10px;right:10px;z-index:9999;
    font:12px/1.4 'Segoe UI',monospace;color:#fecaca;background:#450a0a;
    border:1px solid #991b1b;padding:6px 10px;border-radius:8px;display:none;
  }
</style>
</head>
<body>
<iframe id="view" title="UFO Flowroom Display"></iframe>
<div id="err"></div>
<script>
  // Flow-room kiosk viewer. The screen has no backend/ANT access, so it loads
  // this page over HTTP from GitHub Pages, which serves real text/html.
  // NOTE: raw.githubusercontent.com can never be used for this -- it serves
  // EVERY file as text/plain with X-Content-Type-Options: nosniff, so a
  // browser shows source text instead of a page. That applies to this file
  // too, not just the target, so the srcdoc trick below does not rescue it.
  // Being logged in to GitHub does not change the Content-Type.
  //
  // This page fetches the target file from its own directory every N ms and
  // swaps it into an iframe via srcdoc, giving flicker-free auto-refresh
  // without the target file needing its own <meta refresh>.
  //
  // Usage:
  //   kiosk.html?file=dashboard.html            (UFO Engine Monitor screen)
  //   kiosk.html?file=ubergabe_board.html        (Übergabe Board screen)
  //   kiosk.html?file=a.html,b.html              (rotate between several files on
  //                                                one screen -- see rotate=)
  //   kiosk.html?file=...&interval=15000         (override poll interval, ms)
  //   kiosk.html?file=a.html,b.html&rotate=30000 (seconds each file is shown when
  //                                                more than one is given;
  //                                                default 20000)
  //   kiosk.html?file=...&scale=0.95             (shrink content -- compensates
  //                                                for TV overscan / bezel crop
  //                                                cutting off screen edges;
  //                                                default 0.95 = 5% margin
  //                                                on all sides, centered)

  var params   = new URLSearchParams(location.search);
  var files    = (params.get('file') || 'dashboard.html')
                   .split(',').map(function (s) { return s.trim(); })
                   .filter(Boolean);
  var pollMs   = parseInt(params.get('interval') || '10000', 10);
  var rotateMs = parseInt(params.get('rotate') || '20000', 10);
  var idx      = 0;
  var scale    = parseFloat(params.get('scale') || '0.95');
  var REPO_RAW = '';   // same directory as this page (served by GitHub Pages)

  var iframe = document.getElementById('view');
  var errBox = document.getElementById('err');
  var lastHtml = null;

  if (scale > 0 && scale !== 1) {
    iframe.style.transform = 'scale(' + scale + ')';
  }

  function tick() {
    var url = REPO_RAW + files[idx] + '?t=' + Date.now();  // cache-bust GitHub's CDN
    fetch(url, { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function (html) {
        if (html !== lastHtml) {
          iframe.srcdoc = html;
          lastHtml = html;
        }
        errBox.style.display = 'none';
      })
      .catch(function (err) {
        errBox.textContent = 'Update failed (' + new Date().toLocaleTimeString() + '): ' + err.message;
        errBox.style.display = 'block';
      });
  }

  tick();
  setInterval(tick, pollMs);

  // With several files, cycle the screen through them; lastHtml is cleared so the
  // next tick always repaints even if the new file happens to be byte-identical.
  if (files.length > 1) {
    setInterval(function () {
      idx = (idx + 1) % files.length;
      lastHtml = null;
      tick();
    }, rotateMs);
  }
</script>
</body>
</html>
